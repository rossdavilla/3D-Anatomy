    display: flex;

    justify-content: space-between;
    padding: 14px 20px;
    background: linear-gradient(to bottom, rgba(20,22,27,0.85), rgba(20,22,27,0));

  }
  #topbar h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0;
    color: var(--ink);
    pointer-events: auto;
  }
  #resetBtn {
    pointer-events: auto;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  #resetBtn:hover {
    border-color: var(--accent);
    background: rgba(111, 184, 176, 0.1);
  }
  #resetBtn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #infoPanel {
    position: fixed;
    left: 20px;
    bottom: 20px;
    max-width: min(420px, calc(100vw - 40px));
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    backdrop-filter: blur(6px);
  }
  #labelText {
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink-muted);
  }
  #labelText.active {
    color: var(--ink);
    font-weight: 600;
    font-size: 15px;
  }
  #labelRow {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #infoBtn {
    flex: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 700;
    font-size: 12px;
    line-height: 1;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  #infoBtn.hidden {
    display: none;
  }
  #infoBtn:hover,
  #infoBtn.open {
    background: var(--accent);
    color: var(--bg);
  }
  #infoBtn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #descriptionText {
    margin: 10px 0 0 0;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink);
  }
  #descriptionText.hidden {
    display: none;
  }
  #attribution {
    position: fixed;
    right: 16px;
    bottom: 16px;
    font-size: 11px;
    color: var(--ink-muted);
    text-align: right;
    line-height: 1.4;
    pointer-events: none;
  }
  #loadingOverlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink-muted);
    font-size: 14px;
    z-index: 10;
    transition: opacity 0.4s ease;
  }
  #loadingOverlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    #loadingOverlay { transition: none; }
  }
</style>

      if (nodeDef.scale) obj.scale.fromArray(nodeDef.scale);
      if (nodeDef.matrix) {
        const m = new THREE.Matrix4().fromArray(nodeDef.matrix);
        m.decompose(obj.position, obj.quaternion, obj.scale);
      }

      if (nodeDef.mesh !== undefined) {
        const meshData = meshGeoms[nodeDef.mesh];
        if (meshData.materialIndex !== null && meshData.materialIndex !== undefined) {
          const baseMat = materials[meshData.materialIndex];
          const mat = baseMat ? baseMat.clone() : new THREE.MeshStandardMaterial({ color: 0xd0a090, roughness: 0.55 });
          const mesh = new THREE.Mesh(meshData.geometry, mat);
          mesh.name = nodeDef.name;
          mesh.userData.displayName = prettifyName(nodeDef.name || "");
          mesh.userData.baseKey = baseKey(nodeDef.name || "");
          obj.add(mesh);
          namedParts.push(mesh);
        }
      }

      if (nodeDef.children) {
        nodeDef.children.forEach(function (childIndex) {
          obj.add(buildNode(childIndex));
        });
      }
      return obj;
    }

    const root = new THREE.Group();
    const sceneDef = json.scenes[json.scene || 0];
    sceneDef.nodes.forEach(function (rootIndex) {
      root.add(buildNode(rootIndex));
    });

    return { root: root, namedParts: namedParts };
  }

  // ---------------------------------------------------------------------
  // Minimal orbit / pan / zoom controls (mouse, touch, and trackpad),
  // written by hand so this page has no dependency beyond three.js core.
  // ---------------------------------------------------------------------
  function OrbitLikeControls(camera, domElement) {
    this.camera = camera;
    this.domElement = domElement;
    this.target = new THREE.Vector3();
    this.minDistance = 0.01;
    this.maxDistance = 1000;
    this.minPolarAngle = 0.08;
    this.maxPolarAngle = Math.PI - 0.08;

    this._pointers = new Map();
    this._isDragging = false;
    this._dragButton = 0;
    this._lastX = 0;
    this._lastY = 0;
    this._startX = 0;
    this._startY = 0;
    this._moved = false;
    this._prevPinchDist = null;

    const self = this;
    domElement.addEventListener("pointerdown", function (e) { self._onPointerDown(e); });
    domElement.addEventListener("pointermove", function (e) { self._onPointerMove(e); });
    window.addEventListener("pointerup", function (e) { self._onPointerUp(e); });
    window.addEventListener("pointercancel", function (e) { self._onPointerUp(e); });
    domElement.addEventListener("wheel", function (e) { self._onWheel(e); }, { passive: false });
    domElement.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  }

  OrbitLikeControls.prototype._pinchDistance = function () {
    const pts = Array.from(this._pointers.values());
    const dx = pts[0].x - pts[1].x;
    const dy = pts[0].y - pts[1].y;
    return Math.sqrt(dx * dx + dy * dy);
  };

  OrbitLikeControls.prototype._onPointerDown = function (e) {
    this.domElement.setPointerCapture(e.pointerId);
    this._pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (this._pointers.size === 1) {
      this._isDragging = true;
      this._dragButton = e.button;
      this._lastX = e.clientX;
      this._lastY = e.clientY;
      this._startX = e.clientX;
      this._startY = e.clientY;
      this._moved = false;
    } else if (this._pointers.size === 2) {
      this._isDragging = false;
      this._prevPinchDist = this._pinchDistance();
    }
  };

  OrbitLikeControls.prototype._onPointerMove = function (e) {
    if (!this._pointers.has(e.pointerId)) return;
    this._pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (this._pointers.size >= 2) {
      const dist = this._pinchDistance();
      if (this._prevPinchDist != null) {
        this._zoomByDelta(this._prevPinchDist - dist);
      }
      this._prevPinchDist = dist;
      return;
    }

    if (this._isDragging) {
      const dx = e.clientX - this._lastX;
      const dy = e.clientY - this._lastY;
      this._lastX = e.clientX;
      this._lastY = e.clientY;
      if (Math.abs(e.clientX - this._startX) > 3 || Math.abs(e.clientY - this._startY) > 3) {
        this._moved = true;
      }
      const isPan = this._dragButton === 2 || e.shiftKey;
      if (isPan) this._pan(dx, dy); else this._rotate(dx, dy);
    }
  };

  OrbitLikeControls.prototype._onPointerUp = function (e) {
    this._pointers.delete(e.pointerId);
    if (this._pointers.size < 1) this._isDragging = false;
    if (this._pointers.size < 2) this._prevPinchDist = null;
  };

  OrbitLikeControls.prototype._rotate = function (dx, dy) {
    const offset = new THREE.Vector3().copy(this.camera.position).sub(this.target);
    const spherical = new THREE.Spherical().setFromVector3(offset);
    spherical.theta -= dx * 0.006;
    spherical.phi -= dy * 0.006;
    spherical.phi = Math.max(this.minPolarAngle, Math.min(this.maxPolarAngle, spherical.phi));
    spherical.makeSafe();
    offset.setFromSpherical(spherical);
    this.camera.position.copy(this.target).add(offset);
    this.camera.lookAt(this.target);
  };

  OrbitLikeControls.prototype._pan = function (dx, dy) {
    const distance = this.camera.position.distanceTo(this.target);
    const panScale = distance * 0.0016;
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(this.camera.quaternion).multiplyScalar(-dx * panScale);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(this.camera.quaternion).multiplyScalar(dy * panScale);
    this.camera.position.add(right).add(up);
    this.target.add(right).add(up);
    this.camera.lookAt(this.target);
  };

  OrbitLikeControls.prototype._zoomByDelta = function (delta) {
    const offset = new THREE.Vector3().copy(this.camera.position).sub(this.target);
    let distance = offset.length();
    distance *= Math.pow(0.995, -delta);
    distance = Math.max(this.minDistance, Math.min(this.maxDistance, distance));
    offset.setLength(distance);
    this.camera.position.copy(this.target).add(offset);
    this.camera.lookAt(this.target);
  };

  OrbitLikeControls.prototype._onWheel = function (e) {
    e.preventDefault();
    this._zoomByDelta(-e.deltaY * 0.4);
  };

  OrbitLikeControls.prototype.wasDragged = function () {
    return this._moved;
  };

  // ---------------------------------------------------------------------
  // Scene setup
  // ---------------------------------------------------------------------
  const canvas = document.getElementById("viewer-canvas");
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14161b);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.001, 100);
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x362a22, 0.9));
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));
  const key = new THREE.DirectionalLight(0xffffff, 0.9);
  key.position.set(1, 1.4, 1.2);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.35);
  fill.position.set(-1.3, 0.3, -0.9);
  scene.add(fill);

  const controls = new OrbitLikeControls(camera, renderer.domElement);
  const raycaster = new THREE.Raycaster();
  const mouseNDC = new THREE.Vector2();

  const labelEl = document.getElementById("labelText");
  const infoBtn = document.getElementById("infoBtn");
  const descriptionEl = document.getElementById("descriptionText");
  const defaultHint = labelEl.textContent;
  let selectedMesh = null;
  const highlightColor = new THREE.Color(0x6fb8b0);

  function closeDescription() {
    descriptionEl.classList.add("hidden");
    descriptionEl.textContent = "";
    infoBtn.classList.remove("open");
  }

  function selectPart(mesh) {
    if (selectedMesh === mesh) return;
    if (selectedMesh) {
      selectedMesh.material.emissive.setHex(0x000000);
      selectedMesh.material.emissiveIntensity = 1;
    }
    selectedMesh = mesh;
    selectedMesh.material.emissive.copy(highlightColor);
    selectedMesh.material.emissiveIntensity = 0.45;
    labelEl.textContent = mesh.userData.displayName;
    labelEl.classList.add("active");
    closeDescription();
    if (DESCRIPTIONS[mesh.userData.baseKey]) {
      infoBtn.classList.remove("hidden");
    } else {
      infoBtn.classList.add("hidden");
    }
  }

  function deselectPart() {
    if (selectedMesh) {
      selectedMesh.material.emissive.setHex(0x000000);
    }
    selectedMesh = null;
    labelEl.textContent = defaultHint;
    labelEl.classList.remove("active");
    infoBtn.classList.add("hidden");
    closeDescription();
  }

  infoBtn.addEventListener("click", function () {
    if (!selectedMesh) return;
    const isOpen = !descriptionEl.classList.contains("hidden");
    if (isOpen) {
      closeDescription();
    } else {
      descriptionEl.textContent = DESCRIPTIONS[selectedMesh.userData.baseKey] || "";
      descriptionEl.classList.remove("hidden");
      infoBtn.classList.add("open");
    }
  });

  let namedParts = [];
  let modelRoot = null;

  // Both the initial load and the Reset button call frameCamera(), so
  // changing this angle changes what "home" looks like in both places.
  const DEFAULT_VIEW_THETA = Math.PI / 4; // 45 degrees, turned to the viewer's left

  function frameCamera() {
    const box = new THREE.Box3().setFromObject(modelRoot);
    const size = new THREE.Vector3();
    const center = new THREE.Vector3();
    box.getSize(size);
    box.getCenter(center);
    const maxDim = Math.max(size.x, size.y, size.z) || 0.1;
    const distance = maxDim * 2.4;

    const spherical = new THREE.Spherical(distance, Math.PI / 2, DEFAULT_VIEW_THETA);
    const offset = new THREE.Vector3().setFromSpherical(spherical);

    controls.target.copy(center);
    camera.position.copy(center).add(offset);
    camera.lookAt(center);
    camera.near = Math.max(maxDim / 500, 0.0005);
    camera.far = distance * 50;
    camera.updateProjectionMatrix();

    controls.minDistance = maxDim * 0.2;
    controls.maxDistance = maxDim * 6;
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener("resize", onResize);

  renderer.domElement.addEventListener("pointerup", function (e) {
    if (controls.wasDragged()) return;
    const rect = renderer.domElement.getBoundingClientRect();
    mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);
    const hits = raycaster.intersectObjects(namedParts, false);
    if (hits.length > 0) {
      selectPart(hits[0].object);
    } else {
      deselectPart();
    }
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    deselectPart();
    frameCamera();
  });

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }

  // ---------------------------------------------------------------------
  // Load and go
  // ---------------------------------------------------------------------
  try {
    const buffer = base64ToArrayBuffer(MODEL_BASE64);
    const parsed = parseGLB(buffer);
    const materials = buildMaterials(parsed.json);
    const meshGeoms = buildMeshGeometries(parsed.json, parsed.bin);
    const graph = buildSceneGraph(parsed.json, parsed.bin, meshGeoms, materials);

    modelRoot = graph.root;
    namedParts = graph.namedParts;
    scene.add(modelRoot);
    frameCamera();
    animate();

    document.getElementById("loadingOverlay").classList.add("hidden");
  } catch (err) {
    document.getElementById("loadingOverlay").innerHTML =
      "<p>Something went wrong loading the model.<br>" + (err && err.message ? err.message : err) + "</p>";
    console.error(err);
  }
})();
</script>
</body>
</html>
