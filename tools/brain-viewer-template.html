<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neocortex — 3D Viewer</title>
<style>
  :root {
    --bg: #14161b;
    --panel-bg: rgba(20, 22, 27, 0.82);
    --ink: #e9e6df;
    --ink-muted: #9a9990;
    --accent: #6fb8b0;
    --border: rgba(233, 230, 223, 0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #viewer-canvas {
    position: fixed;
    inset: 0;
    display: block;
    touch-action: none;
  }
  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: linear-gradient(to bottom, rgba(20,22,27,0.85), rgba(20,22,27,0));
    pointer-events: none;
  }
  #topbar h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0;
    color: var(--ink);
    pointer-events: auto;
  }
  #resetBtn {
    pointer-events: auto;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  #resetBtn:hover {
    border-color: var(--accent);
    background: rgba(111, 184, 176, 0.1);
  }
  #resetBtn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #legend {
    position: fixed;
    left: 20px;
    top: 56px;
    width: 186px;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px;
    backdrop-filter: blur(6px);
  }
  .legend-heading {
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    padding: 7px 7px 4px;
  }
  .legend-heading + .legend-item { margin-top: 0; }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 5px 7px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--ink-muted);
    font-family: inherit;
    font-size: 12.5px;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .legend-item:hover { background: rgba(233, 230, 223, 0.07); color: var(--ink); }
  .legend-item.selected { background: rgba(111, 184, 176, 0.14); color: var(--ink); font-weight: 600; }
  .legend-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .swatch {
    flex: none;
    width: 11px;
    height: 11px;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
  }
  #infoPanel {
    position: fixed;
    left: 20px;
    bottom: 20px;
    max-width: min(420px, calc(100vw - 40px));
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    backdrop-filter: blur(6px);
  }
  #labelText {
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink-muted);
  }
  #labelText.active {
    color: var(--ink);
    font-weight: 600;
    font-size: 15px;
  }
  #labelRow {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #infoBtn {
    flex: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 700;
    font-size: 12px;
    line-height: 1;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  #infoBtn.hidden {
    display: none;
  }
  #infoBtn:hover,
  #infoBtn.open {
    background: var(--accent);
    color: var(--bg);
  }
  #infoBtn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #descriptionText {
    margin: 10px 0 0 0;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink);
  }
  #descriptionText.hidden {
    display: none;
  }
  #attribution {
    position: fixed;
    right: 16px;
    bottom: 16px;
    font-size: 11px;
    color: var(--ink-muted);
    text-align: right;
    line-height: 1.4;
    max-width: 260px;
  }
  #attribution a { color: var(--ink-muted); }
  #loadingOverlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink-muted);
    font-size: 14px;
    z-index: 10;
    transition: opacity 0.4s ease;
  }
  #loadingOverlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  /* On narrow screens the legend becomes a wrapping strip under the title,
     so it never crowds the model or the info panel. */
  @media (max-width: 620px) {
    #legend {
      right: 20px;
      width: auto;
      max-height: 34vh;
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
    }
    .legend-heading { display: none; }
    .legend-item { width: auto; font-size: 12px; }
    #infoPanel { max-width: calc(100vw - 40px); }
    #attribution { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #loadingOverlay { transition: none; }
  }
</style>
</head>
<body>

<canvas id="viewer-canvas"></canvas>

<div id="topbar">
  <h1>Neocortex</h1>
  <button id="resetBtn" type="button">Reset view</button>
</div>

<div id="legend"></div>

<div id="infoPanel">
  <div id="labelRow">
    <p id="labelText">Drag to rotate · scroll to zoom · right-click drag to pan · click a structure to see its name</p>
    <button id="infoBtn" type="button" class="hidden" aria-label="More information about this structure" title="More information">i</button>
  </div>
  <p id="descriptionText" class="hidden"></p>
</div>

<div id="attribution">Model: <a href="https://sketchfab.com/3d-models/brain-project-24ec03412dd8432bb0d3e750a72608e0">Brain Project</a> by Dean Lavery<br>Licensed CC BY 4.0 · lobe boundaries follow the model’s own painted texture and are approximate</div>

<div id="loadingOverlay"><p>Loading model…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // The exported model, embedded directly so this page works as one file.
  // ---------------------------------------------------------------------
  const MODEL_BASE64 = "__MODEL_BASE64__";

  // ---------------------------------------------------------------------
  // Minimal glTF binary (.glb) reader.
  // Only the small subset of the format this specific export uses:
  // positions, normals, indices, and simple base-color materials.
  // ---------------------------------------------------------------------
  function base64ToArrayBuffer(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  function parseGLB(arrayBuffer) {
    const dv = new DataView(arrayBuffer);
    const length = dv.getUint32(8, true);
    let offset = 12;
    let json = null;
    let bin = null;
    while (offset < length) {
      const chunkLength = dv.getUint32(offset, true);
      const chunkType = dv.getUint32(offset + 4, true);
      const chunkStart = offset + 8;
      const chunkData = arrayBuffer.slice(chunkStart, chunkStart + chunkLength);
      if (chunkType === 0x4e4f534a) { // 'JSON'
        json = JSON.parse(new TextDecoder("utf-8").decode(chunkData));
      } else if (chunkType === 0x004e4942) { // 'BIN\0'
        bin = chunkData;
      }
      offset = chunkStart + chunkLength;
    }
    return { json, bin };
  }

  const COMPONENT_TYPES = {
    5120: Int8Array,
    5121: Uint8Array,
    5122: Int16Array,
    5123: Uint16Array,
    5125: Uint32Array,
    5126: Float32Array
  };
  const TYPE_SIZES = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4, MAT4: 16 };

  function readAccessor(json, bin, index) {
    const accessor = json.accessors[index];
    const bufferView = json.bufferViews[accessor.bufferView];
    const ArrType = COMPONENT_TYPES[accessor.componentType];
    const numComponents = TYPE_SIZES[accessor.type];
    const byteOffset = (bufferView.byteOffset || 0) + (accessor.byteOffset || 0);
    const length = accessor.count * numComponents;
    const byteLength = length * ArrType.BYTES_PER_ELEMENT;
    const slice = bin.slice(byteOffset, byteOffset + byteLength);
    return new ArrType(slice);
  }

  // Mesh names carry a ".l" / ".r" suffix for the paired structures; both
  // sides of a pair share one entry in the legend and one description.
  function baseKey(raw) {
    return raw.replace(/\.l$/, "").replace(/\.r$/, "");
  }

  // Listed in the order they appear in the legend. "cortex" entries are the
  // lobes of the neocortex itself; "other" entries are the structures that
  // came with the model and sit under or between the hemispheres.
  const STRUCTURES = [
    {
      key: "Frontal lobe",
      group: "cortex",
      description: "The frontal lobe sits at the front of each hemisphere, behind the forehead. It holds the primary motor cortex, which commands voluntary movement, along with the prefrontal cortex behind the eyes — the region most associated with planning, judgement, working memory and personality. Broca's area, in the left frontal lobe of most people, produces speech."
    },
    {
      key: "Parietal lobe",
      group: "cortex",
      description: "The parietal lobe occupies the upper rear of each hemisphere. Its front edge is the primary somatosensory cortex, which receives touch, temperature and pain from the body, laid out as a map from head to toe. The rest integrates those signals with vision to track where the body and nearby objects are in space."
    },
    {
      key: "Temporal lobe",
      group: "cortex",
      description: "The temporal lobe runs along the side of the brain, below the lateral sulcus and roughly behind the ear. It contains the primary auditory cortex and, in most people, Wernicke's area for understanding language. Folded into its inner surface are the hippocampus and amygdala, which are central to forming new memories and to emotion."
    },
    {
      key: "Occipital lobe",
      group: "cortex",
      description: "The occipital lobe is the smallest lobe, at the very back of the brain. It is almost entirely devoted to vision: signals arriving from the eyes reach the primary visual cortex here, where basic features such as edges, orientation and motion are extracted before being passed forward to the parietal and temporal lobes."
    },
    {
      key: "Insula",
      group: "cortex",
      description: "The insula is a fifth lobe, hidden from the outside — it lies buried in the depth of the lateral sulcus, covered over by the frontal, parietal and temporal lobes. It handles taste, the sense of the body's internal state such as hunger, heartbeat and nausea, and contributes to emotional awareness and empathy."
    },
    {
      key: "Corpus callosum",
      group: "other",
      description: "The corpus callosum is a thick arched bundle of roughly 200 million nerve fibres connecting the two cerebral hemispheres. It is the brain's main commissure, letting the two sides share sensory information and coordinate their activity. Cutting it, once done to control severe epilepsy, produces the classic split-brain findings."
    },
    {
      key: "Cerebellum",
      group: "other",
      description: "The cerebellum, or \"little brain\", sits beneath the back of the cerebral hemispheres. Despite taking up about a tenth of the brain's volume it holds more than half of its neurons. It does not initiate movement but refines it, comparing intended and actual motion to keep it smooth, accurate and well timed, and it contributes to balance and motor learning."
    },
    {
      key: "Brainstem",
      group: "other",
      description: "The brainstem — midbrain, pons and medulla oblongata — is the stalk connecting the cerebrum to the spinal cord, shown here together with the diencephalon above it. Every signal travelling between brain and body passes through it, most cranial nerves arise from it, and it runs the automatic functions that keep you alive: breathing, heart rate, blood pressure, swallowing and arousal."
    },
    {
      key: "Pituitary gland",
      group: "other",
      description: "The pituitary is a pea-sized gland hanging from the base of the brain on a short stalk, just below the hypothalamus. Often called the master gland, it releases hormones that control growth, metabolism, the stress response, reproduction and water balance — largely by directing other endocrine glands such as the thyroid, adrenals and gonads."
    }
  ];

  const GROUP_HEADINGS = { cortex: "Lobes of the cortex", other: "Other structures" };

  function buildMaterials(json) {
    if (!json.materials) return [];
    return json.materials.map(function (m) {
      const pbr = m.pbrMetallicRoughness || {};
      const c = pbr.baseColorFactor || [0.75, 0.55, 0.5, 1];
      return new THREE.MeshStandardMaterial({
        color: new THREE.Color(c[0], c[1], c[2]),
        roughness: 0.55,
        metalness: 0.05,
        side: THREE.DoubleSide
      });
    });
  }

  function buildMeshGeometries(json, bin) {
    return json.meshes.map(function (meshDef) {
      const prim = meshDef.primitives[0];
      const geometry = new THREE.BufferGeometry();
      const pos = readAccessor(json, bin, prim.attributes.POSITION);
      geometry.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      if (prim.attributes.NORMAL !== undefined) {
        const norm = readAccessor(json, bin, prim.attributes.NORMAL);
        geometry.setAttribute("normal", new THREE.BufferAttribute(norm, 3));
      } else {
        geometry.computeVertexNormals();
      }
      if (prim.indices !== undefined) {
        const idx = readAccessor(json, bin, prim.indices);
        geometry.setIndex(new THREE.BufferAttribute(idx, 1));
      }
      return { geometry: geometry, materialIndex: prim.material };
    });
  }

  function buildSceneGraph(json, bin, meshGeoms, materials) {
    const namedParts = [];

    function buildNode(index) {
      const nodeDef = json.nodes[index];
      const obj = new THREE.Group();
      obj.name = nodeDef.name || ("node_" + index);
      if (nodeDef.translation) obj.position.fromArray(nodeDef.translation);
      if (nodeDef.rotation) obj.quaternion.fromArray(nodeDef.rotation);
      if (nodeDef.scale) obj.scale.fromArray(nodeDef.scale);
      if (nodeDef.matrix) {
        const m = new THREE.Matrix4().fromArray(nodeDef.matrix);
        m.decompose(obj.position, obj.quaternion, obj.scale);
      }

      if (nodeDef.mesh !== undefined) {
        const meshData = meshGeoms[nodeDef.mesh];
        if (meshData.materialIndex !== null && meshData.materialIndex !== undefined) {
          const baseMat = materials[meshData.materialIndex];
          const mat = baseMat ? baseMat.clone() : new THREE.MeshStandardMaterial({ color: 0xd0a090, roughness: 0.55 });
          const mesh = new THREE.Mesh(meshData.geometry, mat);
          mesh.name = nodeDef.name;
          mesh.userData.baseKey = baseKey(nodeDef.name || "");
          obj.add(mesh);
          namedParts.push(mesh);
        }
      }

      if (nodeDef.children) {
        nodeDef.children.forEach(function (childIndex) {
          obj.add(buildNode(childIndex));
        });
      }
      return obj;
    }

    const root = new THREE.Group();
    const sceneDef = json.scenes[json.scene || 0];
    sceneDef.nodes.forEach(function (rootIndex) {
      root.add(buildNode(rootIndex));
    });

    return { root: root, namedParts: namedParts };
  }

  // ---------------------------------------------------------------------
  // Minimal orbit / pan / zoom controls (mouse, touch, and trackpad),
  // written by hand so this page has no dependency beyond three.js core.
  // ---------------------------------------------------------------------
  function OrbitLikeControls(camera, domElement) {
    this.camera = camera;
    this.domElement = domElement;
    this.target = new THREE.Vector3();
    this.minDistance = 0.01;
    this.maxDistance = 1000;
    this.minPolarAngle = 0.08;
    this.maxPolarAngle = Math.PI - 0.08;

    this._pointers = new Map();
    this._isDragging = false;
    this._dragButton = 0;
    this._lastX = 0;
    this._lastY = 0;
    this._startX = 0;
    this._startY = 0;
    this._moved = false;
    this._prevPinchDist = null;
    this.changed = false;

    const self = this;
    domElement.addEventListener("pointerdown", function (e) { self._onPointerDown(e); });
    domElement.addEventListener("pointermove", function (e) { self._onPointerMove(e); });
    window.addEventListener("pointerup", function (e) { self._onPointerUp(e); });
    window.addEventListener("pointercancel", function (e) { self._onPointerUp(e); });
    domElement.addEventListener("wheel", function (e) { self._onWheel(e); }, { passive: false });
    domElement.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  }

  OrbitLikeControls.prototype._pinchDistance = function () {
    const pts = Array.from(this._pointers.values());
    const dx = pts[0].x - pts[1].x;
    const dy = pts[0].y - pts[1].y;
    return Math.sqrt(dx * dx + dy * dy);
  };

  OrbitLikeControls.prototype._onPointerDown = function (e) {
    this.domElement.setPointerCapture(e.pointerId);
    this._pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (this._pointers.size === 1) {
      this._isDragging = true;
      this._dragButton = e.button;
      this._lastX = e.clientX;
      this._lastY = e.clientY;
      this._startX = e.clientX;
      this._startY = e.clientY;
      this._moved = false;
    } else if (this._pointers.size === 2) {
      this._isDragging = false;
      this._prevPinchDist = this._pinchDistance();
    }
  };

  OrbitLikeControls.prototype._onPointerMove = function (e) {
    if (!this._pointers.has(e.pointerId)) return;
    this._pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (this._pointers.size >= 2) {
      const dist = this._pinchDistance();
      if (this._prevPinchDist != null) {
        this._zoomByDelta(this._prevPinchDist - dist);
      }
      this._prevPinchDist = dist;
      return;
    }

    if (this._isDragging) {
      const dx = e.clientX - this._lastX;
      const dy = e.clientY - this._lastY;
      this._lastX = e.clientX;
      this._lastY = e.clientY;
      if (Math.abs(e.clientX - this._startX) > 3 || Math.abs(e.clientY - this._startY) > 3) {
        this._moved = true;
      }
      const isPan = this._dragButton === 2 || e.shiftKey;
      if (isPan) this._pan(dx, dy); else this._rotate(dx, dy);
    }
  };

  OrbitLikeControls.prototype._onPointerUp = function (e) {
    this._pointers.delete(e.pointerId);
    if (this._pointers.size < 1) this._isDragging = false;
    if (this._pointers.size < 2) this._prevPinchDist = null;
  };

  OrbitLikeControls.prototype._rotate = function (dx, dy) {
    this.changed = true;
    const offset = new THREE.Vector3().copy(this.camera.position).sub(this.target);
    const spherical = new THREE.Spherical().setFromVector3(offset);
    spherical.theta -= dx * 0.006;
    spherical.phi -= dy * 0.006;
    spherical.phi = Math.max(this.minPolarAngle, Math.min(this.maxPolarAngle, spherical.phi));
    spherical.makeSafe();
    offset.setFromSpherical(spherical);
    this.camera.position.copy(this.target).add(offset);
    this.camera.lookAt(this.target);
  };

  OrbitLikeControls.prototype._pan = function (dx, dy) {
    this.changed = true;
    const distance = this.camera.position.distanceTo(this.target);
    const panScale = distance * 0.0016;
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(this.camera.quaternion).multiplyScalar(-dx * panScale);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(this.camera.quaternion).multiplyScalar(dy * panScale);
    this.camera.position.add(right).add(up);
    this.target.add(right).add(up);
    this.camera.lookAt(this.target);
  };

  OrbitLikeControls.prototype._zoomByDelta = function (delta) {
    this.changed = true;
    const offset = new THREE.Vector3().copy(this.camera.position).sub(this.target);
    let distance = offset.length();
    distance *= Math.pow(0.995, -delta);
    distance = Math.max(this.minDistance, Math.min(this.maxDistance, distance));
    offset.setLength(distance);
    this.camera.position.copy(this.target).add(offset);
    this.camera.lookAt(this.target);
  };

  OrbitLikeControls.prototype._onWheel = function (e) {
    e.preventDefault();
    this._zoomByDelta(-e.deltaY * 0.4);
  };

  OrbitLikeControls.prototype.wasDragged = function () {
    return this._moved;
  };

  // ---------------------------------------------------------------------
  // Scene setup
  // ---------------------------------------------------------------------
  const canvas = document.getElementById("viewer-canvas");
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14161b);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.001, 100);
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x362a22, 0.9));
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));
  const key = new THREE.DirectionalLight(0xffffff, 0.9);
  key.position.set(1, 1.4, 1.2);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.35);
  fill.position.set(-1.3, 0.3, -0.9);
  scene.add(fill);

  const controls = new OrbitLikeControls(camera, renderer.domElement);
  const raycaster = new THREE.Raycaster();
  const mouseNDC = new THREE.Vector2();

  const labelEl = document.getElementById("labelText");
  const infoBtn = document.getElementById("infoBtn");
  const descriptionEl = document.getElementById("descriptionText");
  const legendEl = document.getElementById("legend");
  const defaultHint = labelEl.textContent;
  const highlightColor = new THREE.Color(0x6fb8b0);

  const byKey = new Map();      // structure key -> array of meshes (left + right)
  const rowByKey = new Map();   // structure key -> legend button
  const infoByKey = new Map();  // structure key -> STRUCTURES entry
  STRUCTURES.forEach(function (s) { infoByKey.set(s.key, s); });
  let selectedKey = null;

  function closeDescription() {
    descriptionEl.classList.add("hidden");
    descriptionEl.textContent = "";
    infoBtn.classList.remove("open");
  }

  function setEmissive(key, on) {
    const meshes = byKey.get(key);
    if (!meshes) return;
    meshes.forEach(function (mesh) {
      if (on) {
        mesh.material.emissive.copy(highlightColor);
        mesh.material.emissiveIntensity = 0.38;
      } else {
        mesh.material.emissive.setHex(0x000000);
        mesh.material.emissiveIntensity = 1;
      }
    });
  }

  // Both hemispheres of a paired structure light up together: the legend and
  // the descriptions treat left and right as one entry.
  function selectStructure(key) {
    if (selectedKey === key) return;
    if (selectedKey) {
      setEmissive(selectedKey, false);
      const prevRow = rowByKey.get(selectedKey);
      if (prevRow) prevRow.classList.remove("selected");
    }
    selectedKey = key;
    setEmissive(key, true);
    const row = rowByKey.get(key);
    if (row) row.classList.add("selected");
    labelEl.textContent = key;
    labelEl.classList.add("active");
    closeDescription();
    infoBtn.classList.toggle("hidden", !infoByKey.has(key));
  }

  function deselect() {
    if (selectedKey) {
      setEmissive(selectedKey, false);
      const row = rowByKey.get(selectedKey);
      if (row) row.classList.remove("selected");
    }
    selectedKey = null;
    labelEl.textContent = defaultHint;
    labelEl.classList.remove("active");
    infoBtn.classList.add("hidden");
    closeDescription();
  }

  infoBtn.addEventListener("click", function () {
    if (!selectedKey) return;
    if (!descriptionEl.classList.contains("hidden")) {
      closeDescription();
      return;
    }
    const entry = infoByKey.get(selectedKey);
    descriptionEl.textContent = entry ? entry.description : "";
    descriptionEl.classList.remove("hidden");
    infoBtn.classList.add("open");
  });

  // Swatch colours come from the meshes themselves, so the legend can never
  // drift out of step with what is on screen.
  function buildLegend() {
    let lastGroup = null;
    STRUCTURES.forEach(function (s) {
      const meshes = byKey.get(s.key);
      if (!meshes) return;
      if (s.group !== lastGroup) {
        const heading = document.createElement("div");
        heading.className = "legend-heading";
        heading.textContent = GROUP_HEADINGS[s.group] || "";
        legendEl.appendChild(heading);
        lastGroup = s.group;
      }
      const row = document.createElement("button");
      row.type = "button";
      row.className = "legend-item";
      const swatch = document.createElement("span");
      swatch.className = "swatch";
      swatch.style.background = "#" + meshes[0].material.color.getHexString();
      row.appendChild(swatch);
      row.appendChild(document.createTextNode(s.key));
      row.addEventListener("click", function () {
        if (selectedKey === s.key) deselect(); else selectStructure(s.key);
      });
      legendEl.appendChild(row);
      rowByKey.set(s.key, row);
    });
  }

  let namedParts = [];
  let modelRoot = null;

  // Both the initial load and the Reset button call frameCamera(), so
  // changing this angle changes what "home" looks like in both places.
  // A lateral view, tipped slightly forward and up, shows all four lobes.
  const DEFAULT_VIEW_THETA = Math.PI * 0.42;
  const DEFAULT_VIEW_PHI = Math.PI * 0.45;
  const WORLD_UP = new THREE.Vector3(0, 1, 0);

  function frameCamera() {
    const box = new THREE.Box3().setFromObject(modelRoot);
    const size = new THREE.Vector3();
    const center = new THREE.Vector3();
    box.getSize(size);
    box.getCenter(center);
    const maxDim = Math.max(size.x, size.y, size.z) || 0.1;

    // Measure the model as the camera will actually see it and back off far
    // enough to fit it both ways. On a tall phone screen the limiting axis is
    // horizontal, so fitting the vertical field of view alone crops the sides.
    const dir = new THREE.Vector3().setFromSpherical(
      new THREE.Spherical(1, DEFAULT_VIEW_PHI, DEFAULT_VIEW_THETA)
    );
    const right = new THREE.Vector3().crossVectors(dir, WORLD_UP).normalize();
    const up = new THREE.Vector3().crossVectors(right, dir).normalize();
    const half = size.clone().multiplyScalar(0.5);
    function extentAlong(axis) {
      return Math.abs(axis.x) * half.x + Math.abs(axis.y) * half.y + Math.abs(axis.z) * half.z;
    }
    const aspect = camera.aspect > 0 && isFinite(camera.aspect) ? camera.aspect : 1;
    const halfFovY = THREE.MathUtils.degToRad(camera.fov) / 2;
    const halfFovX = Math.atan(Math.tan(halfFovY) * aspect);
    const distance = Math.max(
      extentAlong(up) / Math.tan(halfFovY),
      extentAlong(right) / Math.tan(halfFovX)
    ) * 1.1 + extentAlong(dir);

    const offset = dir.clone().multiplyScalar(distance);

    controls.target.copy(center);
    camera.position.copy(center).add(offset);
    camera.lookAt(center);
    camera.near = Math.max(maxDim / 500, 0.0005);
    camera.far = distance * 50;
    camera.updateProjectionMatrix();

    controls.minDistance = maxDim * 0.2;
    controls.maxDistance = maxDim * 6;
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    // Re-fit while the view is still the one we chose, so rotating a phone or
    // dragging a window edge never leaves the model half off-screen. Once the
    // reader has moved the camera themselves, leave it alone.
    if (!controls.changed) frameCamera();
  }

  window.addEventListener("resize", onResize);

  renderer.domElement.addEventListener("pointerup", function (e) {
    if (controls.wasDragged()) return;
    const rect = renderer.domElement.getBoundingClientRect();
    mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);
    const hits = raycaster.intersectObjects(namedParts, false);
    if (hits.length > 0) {
      selectStructure(hits[0].object.userData.baseKey);
    } else {
      deselect();
    }
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    deselect();
    controls.changed = false;
    frameCamera();
  });

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }

  // ---------------------------------------------------------------------
  // Load and go
  // ---------------------------------------------------------------------
  try {
    const buffer = base64ToArrayBuffer(MODEL_BASE64);
    const parsed = parseGLB(buffer);
    const materials = buildMaterials(parsed.json);
    const meshGeoms = buildMeshGeometries(parsed.json, parsed.bin);
    const graph = buildSceneGraph(parsed.json, parsed.bin, meshGeoms, materials);

    modelRoot = graph.root;
    namedParts = graph.namedParts;
    namedParts.forEach(function (mesh) {
      const k = mesh.userData.baseKey;
      if (!byKey.has(k)) byKey.set(k, []);
      byKey.get(k).push(mesh);
    });

    scene.add(modelRoot);
    buildLegend();
    frameCamera();
    animate();

    document.getElementById("loadingOverlay").classList.add("hidden");
  } catch (err) {
    document.getElementById("loadingOverlay").innerHTML =
      "<p>Something went wrong loading the model.<br>" + (err && err.message ? err.message : err) + "</p>";
    console.error(err);
  }
})();
</script>
</body>
</html>
